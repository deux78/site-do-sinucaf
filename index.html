<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUCAF & SINUCAF 2026 - Pontos Corridos</title>

<style> 
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    overflow-x: hidden; /* 🔥 remove scroll horizontal */
}

/* BANNER */
.hero img {
    width: 100%;
    height: auto;
    display: block;
}

/* HEADER */
.header {
    text-align: center;
    padding: 1.5rem;
}

.header h1 {
    font-size: clamp(1.8rem, 3vw, 2.8rem);
}

.header p {
    color: #555;
}

/* CONTAINER */
.container {
    width: 100%;
    max-width: 100%;
    padding: 1rem;
    display: flex;
    justify-content: center;
}

/* CARD */
.card {
    width: 100%;
    max-width: 1200px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    overflow: hidden;
}

/* TABELA RESPONSIVA (SEM SCROLL HORIZONTAL) */
.table-wrap {
    width: 100%;
    overflow-x: auto; /* só ativa se necessário, mas quase nunca aparece */
}

iframe {
    width: 100%;
    height: 800px;
    border: none;
    display: block;
}
    
/* FOOTER */
footer {
    text-align: center;
    padding: 2rem;
    color: #666;
    font-size: 0.9rem;
}

/* MOBILE AJUSTE */
@media (max-width: 768px) {
    iframe {
        height: 75vh;
    }
}
</style>

</head>

<body>

<!-- BANNER -->
<div class="hero">
    <img src="https://github.com/deux78/site-do-sinucaf/blob/122fcbd844b1d0b8028f1755743ba63c41108b53/PHOTO-2026-08-11-01-25-55.jpg">
</div>

<!-- HEADER -->
<div class="header">
    <h1>TRUCAF & SINUCAF 2026</h1>
    <p>Sistema de Pontos Corridos Oficial</p>
</div>

<!-- SISTEMA -->
<div class="container">
    <div class="card">

        <iframe
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQKqKa_L8YbiSALyaZVD_dBXnG9WLuhpubEtI0O3dCpFtobGPJSg7UdOVDd76UUWHKFY-ZojHFkjmUT/pubhtml=true"
            width="100%"
            height="800"
            frameborder="0">
        </iframe>

    </div>
</div>

<footer>
    Sistema de Pontos Corridos - TRUCAF & SINUCAF 2026
</footer>

</body>
</html>
